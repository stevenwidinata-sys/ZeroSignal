# Sends the API to its Hugging Face Space whenever main changes.
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   HF_TOKEN  a Hugging Face access token with write access
#   variable HF_SPACE  the Space, e.g. your-name/zerosignal-api
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/hf/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the files the Space needs
        run: |
          mkdir space
          cp -r backend shared Dockerfile .dockerignore space/
          rm -rf space/backend/target
          cp deploy/hf/README.md space/README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "zerosignal-deploy"
          git config user.email "deploy@users.noreply.huggingface.co"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
