# Render Blueprint: the Zero Signal API (free plan).
# Secrets are entered in the Render dashboard, never committed here.
services:
  - type: web
    name: zerosignal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: CORS_ORIGIN # the Vercel site, e.g. https://zerosignal.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: RUST_LOG
        value: info
