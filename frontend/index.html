<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Retro arcade games with real leaderboards." />
    <title>PIXELPLAY · Retro Arcade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ffd23f'/><rect x='3' y='4' width='10' height='9' fill='%233a86ff'/><rect x='5' y='6' width='2' height='2' fill='%23fff'/><rect x='9' y='6' width='2' height='2' fill='%23fff'/></svg>"
    />
    <script>
      // Apply saved/system theme before paint (no flash). Mirrors store/theme.ts.
      (function () {
        var t;
        try { t = localStorage.getItem("arcade_theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
